<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
  <!-- Mochi the Axolotl — mint/teal variant, same anatomy as Una -->

  <!-- Shadow -->
  <ellipse cx="60" cy="122" rx="38" ry="4" fill="rgba(0,0,0,0.25)"/>

  <!-- Tail -->
  <path d="M 88 88 Q 108 85 112 102 Q 104 106 88 100 Z" fill="#A8EFD5" stroke="#3EB89A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Lower body -->
  <ellipse cx="60" cy="95" rx="32" ry="18" fill="#BDF5E0" stroke="#3EB89A" stroke-width="2.5"/>
  <!-- Legs -->
  <ellipse cx="36" cy="108" rx="6" ry="5" fill="#BDF5E0" stroke="#3EB89A" stroke-width="2"/>
  <ellipse cx="84" cy="108" rx="6" ry="5" fill="#BDF5E0" stroke="#3EB89A" stroke-width="2"/>

  <!-- Gills -->
  <g fill="#6FD8BC" stroke="#3EB89A" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 32 38 Q 12 30 4 42 Q 14 40 22 50 Q 10 48 6 60 Q 18 56 28 62 Q 30 50 32 38 Z"/>
    <path d="M 28 58 Q 6 58 2 72 Q 14 68 24 72 Q 14 76 12 86 Q 22 80 30 78 Q 30 68 28 58 Z"/>
  </g>
  <g fill="#6FD8BC" stroke="#3EB89A" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 88 38 Q 108 30 116 42 Q 106 40 98 50 Q 110 48 114 60 Q 102 56 92 62 Q 90 50 88 38 Z"/>
    <path d="M 92 58 Q 114 58 118 72 Q 106 68 96 72 Q 106 76 108 86 Q 98 80 90 78 Q 90 68 92 58 Z"/>
  </g>
  <g stroke="#A8F0DA" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 20 42 L 10 36 M 18 54 L 8 52 M 22 66 L 10 68"/>
    <path d="M 18 72 L 6 72 M 20 82 L 12 88"/>
    <path d="M 100 42 L 110 36 M 102 54 L 112 52 M 98 66 L 110 68"/>
    <path d="M 102 72 L 114 72 M 100 82 L 108 88"/>
  </g>

  <!-- Head -->
  <ellipse cx="60" cy="60" rx="32" ry="28" fill="#BDF5E0" stroke="#3EB89A" stroke-width="2.5"/>
  <ellipse cx="48" cy="48" rx="10" ry="6" fill="#E0FAEE" opacity="0.7"/>

  <!-- Eyes — slightly bigger than Una for distinct look -->
  <circle cx="50" cy="62" r="4" fill="#1F4A3A"/>
  <circle cx="70" cy="62" r="4" fill="#1F4A3A"/>
  <circle cx="51" cy="61" r="1.3" fill="white"/>
  <circle cx="71" cy="61" r="1.3" fill="white"/>

  <!-- :3 smile -->
  <path d="M 50 74 Q 55 77 60 74 Q 65 77 70 74" stroke="#1F7A5A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Blush (pink to add warmth) -->
  <circle cx="38" cy="70" r="5" fill="#FF8AB4" opacity="0.5"/>
  <circle cx="82" cy="70" r="5" fill="#FF8AB4" opacity="0.5"/>
</svg>
